<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Detail</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
  <a href="index.html">&larr; Back to Archive</a>

  <h1 id="event_context">Loading...</h1>
  <img id="image" src="" alt="Family Photo">

  <div id="metadata-box">
    <p><strong>Photo ID:</strong> <span id="photo_id"></span></p>
    <p><strong>Date Taken:</strong> <span id="date_taken"></span></p>
    <p><strong>Photographer:</strong> <span id="photographer"></span></p>
    <p><strong>Location:</strong> <span id="location"></span></p>
    <p><strong>People in the Photo:</strong> <span id="people_in_the_photo"></span></p>
    <p><strong>Photo Format:</strong> <span id="photo_format"></span></p>
    <p><strong>Additional Notes:</strong> <span id="additional_notes"></span></p>
  </div>

  <script src="item.js"></script>
</body>
</html>
