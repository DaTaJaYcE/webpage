<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Photo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="index.html">← Back to Archive</a>
  
  <h1 id="item-title">Loading...</h1>
  <img id="item-image" src="" alt="Photo" />

  <div id="metadata-box">
    <p><strong>Date Taken:</strong> <span id="item-date"></span></p>
    <p><strong>Photographer:</strong> <span id="item-photographer"></span></p>
    <p><strong>Location:</strong> <span id="item-location"></span></p>
    <p><strong>Event/Context:</strong> <span id="item-event"></span></p>
    <p><strong>People in the Photo:</strong> <span id="item-people"></span></p>
    <p><strong>Photo Format:</strong> <span id="item-format"></span></p>
    <p><strong>Photo Condition:</strong> <span id="item-condition"></span></p>
    <p><strong>Digitization Date:</strong> <span id="item-digitization"></span></p>
    <p><strong>Additional Notes:</strong> <span id="item-notes"></span></p>
  </div>

  <script src="item.js"></script>
</body>
</html>
